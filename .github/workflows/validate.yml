name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install website dependencies
        run: npm ci --prefix site

      - name: Check and build website
        run: npm --prefix site run check

      - name: Install browser for local preview tests
        run: npx playwright install --with-deps chromium
        working-directory: site

      - name: Test the production preview
        run: npm --prefix site run test:browser

      - name: Validate repository invariants
        run: node scripts/validate.mjs

      - name: Verify Skills CLI discovery
        run: npx --yes skills add . --list

      - name: Check official links
        run: node scripts/check-links.mjs
