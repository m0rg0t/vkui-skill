name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate repository invariants
        run: node scripts/validate.mjs

      - name: Verify Skills CLI discovery
        run: npx --yes skills add . --list

      - name: Check official links
        run: node scripts/check-links.mjs
