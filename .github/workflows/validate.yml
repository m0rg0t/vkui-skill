name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install website dependencies
        run: npm ci --prefix site

      - name: Build website
        run: npm --prefix site run build -- --logLevel error

      - name: Validate repository invariants
        run: node scripts/validate.mjs

      - name: Verify Skills CLI discovery
        run: npx --yes skills add . --list

      - name: Check official links
        run: node scripts/check-links.mjs
